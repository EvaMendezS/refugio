<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Refugio — tu espacio de registro personal</title>
  <meta name="description" content="Refugio: registrá tu ánimo, cuerpo y hábitos cada día, en privado y sin conexión.">
  <meta name="theme-color" content="#E4308F">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="app-root">

    <!-- Contenedor principal donde app.js/ui.js inyectan cada vista -->
    <main id="app-view" aria-live="polite"></main>

    <!-- Navegación inferior fija (se oculta durante el onboarding) -->
    <nav id="bottom-nav" hidden>
      <button class="nav-item" data-ruta="dashboard" onclick="location.hash='#dashboard'">
        <span class="nav-icon">🏠</span><span>Inicio</span>
      </button>
      <button class="nav-item" data-ruta="registro" onclick="location.hash='#registro'">
        <span class="nav-icon">📝</span><span>Registro</span>
      </button>
      <button class="nav-item" data-ruta="timeline" onclick="location.hash='#timeline'">
        <span class="nav-icon">🕰️</span><span>Timeline</span>
      </button>
      <button class="nav-item" data-ruta="calendario" onclick="location.hash='#calendario'">
        <span class="nav-icon">📅</span><span>Calendario</span>
      </button>
      <button class="nav-item" data-ruta="estadisticas" onclick="location.hash='#estadisticas'">
        <span class="nav-icon">📊</span><span>Stats</span>
      </button>
      <button class="nav-item" data-ruta="perfil" onclick="location.hash='#perfil'">
        <span class="nav-icon">🙋</span><span>Perfil</span>
      </button>
    </nav>
  </div>

  <!-- ================= SCRIPTS =================
       Orden importante: primero los datos/contenido estáticos,
       luego las capas de la app (storage -> analytics -> pdf -> ui),
       y al final app.js que las conecta a todas. Sin módulos ES para
       máxima compatibilidad con file:// y GitHub Pages. -->
  <script src="data.js"></script>
  <script src="content.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
